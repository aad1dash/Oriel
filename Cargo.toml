[package]
name = "oriel"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A local-first source-intelligence engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aad1dash/Oriel"
readme = "README.md"
keywords = ["youtube", "captions", "mcp", "retrieval", "source-intelligence"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[dependencies]
rmcp = { version = "3.1.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[[bench]]
name = "retrieval_latency"
harness = false
