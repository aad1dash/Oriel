[package]
name = "oriel"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A local-first source-intelligence engine"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[[bench]]
name = "retrieval_latency"
harness = false
